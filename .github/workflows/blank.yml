## README.md (Docker Hub friendly)
```markdown
# qb-port-sync

Automatically syncs qBittorrent's listening port with the current VPN-forwarded port from Gluetun. Ideal for stacks using `network_mode: service:gluetun` with ProtonVPN/Mullvad/etc.

## Features
- Polls Gluetun control server for forwarded port
- Updates qBittorrent via Web API
- Optional: detects `firewalled` state and restarts qBittorrent
- Optional: webhook notifications (ntfy/Discord/Slack)
- Configurable via environment variables

## Quick Start (Compose)
See `docker-compose.yml` example in this repo. Ensure `qb-port-sync` and `qbittorrent` share Gluetun's network namespace and mount the Docker socket:

```yaml
  qb-port-sync:
    image: yourdockerhubusername/qb-port-sync:latest
    network_mode: "service:gluetun"
    environment:
      - GLUETUN_API=http://localhost:8000/v1/openvpn/portforwarded
      - QBITTORRENT_HOST=http://localhost:9092
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=adminadmin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
```

## Environment Variables
| Var | Default | Description |
|-----|---------|-------------|
| `GLUETUN_API` | `http://localhost:8000/v1/openvpn/portforwarded` | Gluetun control server endpoint |
| `GLUETUN_USER` | `admin` | Gluetun control auth user |
| `GLUETUN_PASS` | `password` | Gluetun control auth pass |
| `QBITTORRENT_HOST` | `http://localhost:9092` | qBittorrent base URL |
| `QBITTORRENT_USER` | `admin` | qB WebUI username |
| `QBITTORRENT_PASS` | `adminadmin` | qB WebUI password |
| `CHECK_INTERVAL` | `300` | Poll interval in seconds |
| `MONITOR_FIREWALL` | `true` | If `true`, restarts qB when firewalled |
| `QBT_CONTAINER_NAME` | `qbittorrent` | Container name to restart when firewalled |
| `WEBHOOK_URL` | *(unset)* | Optional webhook URL for notifications |

## Build & Run locally
```bash
docker build -t yourname/qb-port-sync:latest .
docker run --rm \
  -e QBITTORRENT_USER=admin -e QBITTORRENT_PASS=pass \
  -e GLUETUN_USER=admin -e GLUETUN_PASS=pass \
  -v /var/run/docker.sock:/var/run/docker.sock \
  yourname/qb-port-sync:latest
```
```

