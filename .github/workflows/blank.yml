## How to publish to Docker Hub via GitHub Actions
1. Create a **public** GitHub repo named `qb-port-sync` and push these files.
2. In the repo, go to **Settings → Secrets and variables → Actions → New repository secret** and add:
   - `DOCKERHUB_USERNAME` → your Docker Hub username
   - `DOCKERHUB_TOKEN` → a Docker Hub **Access Token** (from Docker Hub → Account Settings → Security)
3. Push to `main` or create a tag like `v1.0.0`. The Action will build and publish the image as:
   - `docker.io/<DOCKERHUB_USERNAME>/qb-port-sync:latest`
   - plus a tag for your version (for example, `:v1.0.0`).

You're all set! Copy these files into your repo, add the two secrets, and your image will auto-build and push whenever you update `main` or publish a tag.

