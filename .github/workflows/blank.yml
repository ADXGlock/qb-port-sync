## update_qb_port.py
```python
import os
import json
import time
import requests
import docker

# ---------------------------
# Config via environment variables
# ---------------------------
GLUETUN_API = os.getenv("GLUETUN_API", "http://localhost:8000/v1/openvpn/portforwarded")
GLUETUN_USER = os.getenv("GLUETUN_USER", "admin")
GLUETUN_PASS = os.getenv("GLUETUN_PASS", "password")

QBITTORRENT_HOST = os.getenv("QBITTORRENT_HOST", "http://localhost:9092")
QBITTORRENT_USER = os.getenv("QBITTORRENT_USER", "admin")
QBITTORRENT_PASS = os.getenv("QBITTORRENT_PASS", "adminadmin")

QBT_LOGIN = f"{QBITTORRENT_HOST}/api/v2/auth/login"
QBT_SET_PREFS = f"{QBITTORRENT_HOST}/api/v2/app/setPreferences"
QBT_CONN_STATUS = f"{QBITTORRENT_HOST}/api/v2/app/connection_status"

CHECK_INTERVAL = int(os.getenv("CHECK_INTERVAL", "300"))  # seconds
QBT_CONTAINER_NAME = os.getenv("QBT_CONTAINER_NAME", "qbittorrent")
MONITOR_FIREWALL = os.getenv("MONITOR_FIREWALL", "true").lower() == "true"
WEBHOOK_URL = os.getenv("WEBHOOK_URL")  # e.g. https://ntfy.sh/topic or Discord/Slack webhook

# ---------------------------
# Helpers: logging, webhook
# ---------------------------

def log(level: str, msg: str):
    ts = time.strftime("%Y-%m-%d %H:%M:%S")
    print(f"[{level}] {ts} - {msg}", flush=True)


def notify(msg: str):
    if not WEBHOOK_URL:
        return
    try:
        # generic JSON payload; many services accept {"text": ...}
        requests.post(WEBHOOK_URL, json={"text": msg}, timeout=8)
    except Exception as e:
        log("ERROR", f"Webhook send failed: {e}")

# ---------------------------
# Gluetun: get forwarded port
# ---------------------------

def get_forwarded_port():
    try:
        r = requests.get(GLUETUN_API, auth=(GLUETUN_USER, GLUETUN_PASS), timeout=10)
        r.raise_for_status()
        log("INFO", f"Gluetun API response: {r.text}")
        return int(r.json().get("port"))
    except Exception as e:
        log("ERROR", f"Failed to get forwarded port from Gluetun: {e}")
        return None

# ---------------------------
# qBittorrent: login session
# ---------------------------

def qbt_session():
    s = requests.Session()
    r = s.post(QBT_LOGIN, data={"username": QBITTORRENT_USER, "password": QBITTORRENT_PASS}, timeout=10)
    if r.status_code != 200:
        log("ERROR", f"qBittorrent login failed: {r.status_code} - {r.text}")
        return None
    return s

# ---------------------------
# qBittorrent: set listen port
# ---------------------------

def set_qbt_port(port: int):
    try:
        s = qbt_session()
        if not s:
            return False
        prefs = {"listen_port": port}
        r = s.post(QBT_SET_PREFS, data={"json": json.dumps(prefs)}, timeout=10)
        log("DEBUG", f"qB setPreferences: {r.status_code} - {r.text}")
        if r.status_code == 200:
            log("INFO", f"Updated qBittorrent port to {port}")
            return True
        log("ERROR", f"Failed to update qBittorrent port: {r.status_code} - {r.text}")
        return False
    except Exception as e:
        log("ERROR", f"Exception updating qBittorrent port: {e}")
        return False

# ---------------------------
# qBittorrent: firewall monitor
# ---------------------------

def check_firewalled_and_act():
    if not MONITOR_FIREWALL:
        return
    try:
        s = qbt_session()
        if not s:
            return
        r = s.get(QBT_CONN_STATUS, timeout=10)
        status = r.text.strip()
        log("INFO", f"qBittorrent connection status: {status}")
        if status == "firewalled":
            msg = "⚠️ qBittorrent reports FIREWALLED. Restarting container."
            log("WARN", msg)
            notify(msg)
            restart_container(QBT_CONTAINER_NAME)
    except Exception as e:
        log("ERROR", f"Firewall check failed: {e}")

# ---------------------------
# Docker: restart container
# ---------------------------

def restart_container(name: str):
    try:
        client = docker.from_env()
        c = client.containers.get(name)
        c.restart()
        log("INFO", f"Restarted container: {name}")
        notify(f"🔁 Restarted container: {name}")
    except Exception as e:
        log("ERROR", f"Failed to restart '{name}': {e}")

# ---------------------------
# Main loop
# ---------------------------

def main():
    log("INFO", "qb-port-sync started")
    last_port = None
    while True:
        # 1) Watch firewall state
        check_firewalled_and_act()
        # 2) Sync forwarded port
        port = get_forwarded_port()
        if port and port != last_port:
            log("INFO", f"Detected new forwarded port: {port}")
            if set_qbt_port(port):
                last_port = port
        else:
            log("DEBUG", "No new port or unchanged.")
        time.sleep(CHECK_INTERVAL)

if __name__ == "__main__":
    main()
```

