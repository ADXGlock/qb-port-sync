## docker-compose.yml (example)
```yaml
version: "3.8"
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # ... your WireGuard/OpenVPN env here ...
    ports:
      - "8000:8000"      # Control server (optional to expose)
      - "9092:9092"      # qBittorrent WebUI (if you want LAN access)
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - WEBUI_PORT=9092
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./qbittorrent:/config
      - ./downloads:/downloads
    restart: unless-stopped

  qb-port-sync:
    image: yourdockerhubusername/qb-port-sync:latest
    container_name: qb-port-sync
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - GLUETUN_API=http://localhost:8000/v1/openvpn/portforwarded
      - GLUETUN_USER=admin
      - GLUETUN_PASS=password
      - QBITTORRENT_HOST=http://localhost:9092
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=adminadmin
      - CHECK_INTERVAL=300
      - MONITOR_FIREWALL=true
      - QBT_CONTAINER_NAME=qbittorrent
      # - WEBHOOK_URL=https://ntfy.sh/yourtopic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
```

